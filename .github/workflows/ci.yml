name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.13

jobs:
  web:
    name: Web typecheck and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: bun run typecheck
      - name: Build
        working-directory: web
        run: bun run build

  server:
    name: Server typecheck and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        working-directory: server
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: server
        run: bun run build

  docs:
    name: Docs typecheck and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        working-directory: docs
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: docs
        run: bun run types:check
      - name: Build
        working-directory: docs
        run: bun run build

  deployment-contract:
    name: Deployment contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate shell scripts
        run: |
          for script in deploy/*.sh; do
            sh -n "$script"
          done
      - name: Validate Compose files
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
          docker compose -f docker-compose.local.yml config --quiet

  plugins:
    name: Official plugins build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/canvas/registry/package-lock.json
      - name: Install dependencies
        working-directory: plugins/canvas/registry
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: plugins/canvas/registry
        run: npm run build
